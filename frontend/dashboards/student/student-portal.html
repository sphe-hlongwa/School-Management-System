<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="../../public/favicon.ico?v=2">
    <link rel="shortcut icon" type="image/x-icon" href="../../public/favicon.ico?v=2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Mbambangwe High School</title>
    <meta name="description" content="Student portal for Mbambangwe High School - Access timetables, results, resources and more.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <style>
        .portal-login {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 60%, #1a3a5c 100%);
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        .portal-login::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212,175,55,0.08) 0%, transparent 70%);
            pointer-events: none;
        }
        .portal-login::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212,175,55,0.05) 0%, transparent 70%);
            pointer-events: none;
        }
        .login-card {
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(20px);
            padding: 3rem 3.5rem;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.1);
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 10;
            animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        .portal-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: var(--navy);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.3rem 0.9rem;
            border-radius: 50px;
            margin-bottom: 1.5rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .login-card .portal-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            color: var(--navy);
            font-size: 1.5rem;
            font-weight: 800;
            text-decoration: none;
            margin-bottom: 0.75rem;
        }
        .login-card .portal-logo img {
            height: 44px;
            width: auto;
            display: block;
        }
        .login-card .portal-logo span { color: var(--gold); }
        .login-card h2 {
            color: var(--navy);
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }
        .login-card .subtitle {
            color: var(--gray);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
            position: relative;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            color: var(--navy);
            font-weight: 600;
            font-size: 0.9rem;
        }
        .form-group .input-wrapper {
            position: relative;
        }
        .form-group .input-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 2.75rem;
            border: 2px solid #e8edf4;
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            background: #f8fafc;
            color: var(--navy);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--gold);
            background: white;
            box-shadow: 0 0 0 4px rgba(212,175,55,0.12);
        }
        .pw-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--gray);
            background: none;
            border: none;
            font-size: 0.9rem;
            padding: 0;
        }
        .pw-toggle:hover { color: var(--navy); }
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.75rem;
            font-size: 0.85rem;
        }
        .form-options label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--gray);
            cursor: pointer;
        }
        .form-options a {
            color: var(--navy);
            font-weight: 600;
            text-decoration: none;
        }
        .form-options a:hover { color: var(--gold); }
        .btn-login {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--navy), var(--navy-light));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(15,23,42,0.4);
        }
        .divider {
            text-align: center;
            color: var(--gray);
            font-size: 0.85rem;
            margin: 1.5rem 0;
            position: relative;
        }
        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #e8edf4;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        .back-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: var(--gray);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--navy); }
        .other-portals {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 100;
        }
        .other-portals a {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        .other-portals a:hover { color: var(--gold); }
        @media (max-width: 480px) {
            .login-card { padding: 2rem 1.5rem; }
        }
        @media (max-width: 640px) {
            .portal-login {
                align-items: flex-start;
                padding-top: 4.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="other-portals">
        <a href="../../index.html"><i class="fas fa-arrow-left"></i> Back to School Site</a>
    </div>

    <div class="portal-login">
        <div class="login-card">
            <a href="../../index.html" class="portal-logo"><img src="../../public/logo.png" alt="Mbambangwe High School logo">Mbambangwe<span>High</span></a>
            <div class="portal-badge"><i class="fas fa-user-graduate"></i> Student Portal</div>
            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to access your dashboard, timetables and results.</p>

            <form id="studentLoginForm">
                <div class="login-error" id="studentLoginError" role="alert">
                    <i class="fas fa-circle-exclamation"></i>
                    <span id="studentLoginErrorText"></span>
                </div>
                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-card"></i>
                        <input type="text" id="studentId" placeholder="e.g. MHS2024001" required autocomplete="username">
                    </div>
                </div>
                <div class="form-group">
                    <label for="studentPassword">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="studentPassword" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="pw-toggle" aria-label="Show password" onclick="this.previousElementSibling.type = this.previousElementSibling.type==='password'?'text':'password'; this.querySelector('i').classList.toggle('fa-eye'); this.querySelector('i').classList.toggle('fa-eye-slash');"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <div class="form-options">
                    <label><input type="checkbox" id="rememberMe"> Remember me</label>
                    <a href="../../contact.html">Forgot Password?</a>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <div class="divider">or</div>
            <a href="../../index.html" class="back-link"><i class="fas fa-home"></i> Return to School Home</a>
        </div>
    </div>

    <script src="../../assets/js/auth.js"></script>
    <script>
        document.getElementById('studentLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorBox = document.getElementById('studentLoginError');
            const errorText = document.getElementById('studentLoginErrorText');
            const originalHTML = btn.innerHTML;

            errorBox.style.display = 'none';
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
            btn.disabled = true;

            try {
                await MHSAuth.login({
                    endpoint: '/api/student/login',
                    body: {
                        studentId: document.getElementById('studentId').value,
                        password: document.getElementById('studentPassword').value
                    },
                    remember: document.getElementById('rememberMe').checked,
                    role: 'student'
                });

                btn.innerHTML = '<i class="fas fa-check"></i> Success! Redirecting...';
                btn.style.background = 'linear-gradient(135deg,#10b981,#059669)';
                setTimeout(() => {
                    window.location.href = 'student-dashboard.html';
                }, 700);
            } catch (err) {
                errorText.textContent = err.message;
                errorBox.style.display = 'flex';
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
